name: ai_ppt_desktop
description: AI-powered PPT creation desktop application for enterprise teams
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  
  # State Management
  flutter_riverpod: ^2.3.6
  riverpod_annotation: ^2.1.1
  
  # Local Storage
  hive: ^2.2.3
  hive_flutter: ^1.1.0
  sqflite_common_ffi: ^2.3.0+2
  path_provider: ^2.0.15
  
  # PPT Generation
  flutter_pptx: ^0.1.0
  dart_pptx: ^0.1.0
  
  # AI Integration
  tflite_flutter: ^0.10.0
  onnxruntime: ^1.4.1
  
  # Audio Processing
  flutter_sound: ^9.2.13
  just_audio: ^0.9.34
  
  # Video Processing
  video_player: ^2.7.0
  
  # UI Components
  flutter_animate: ^4.2.0
  google_fonts: ^5.1.0
  flutter_svg: ^2.0.7
  
  # Utilities
  dio: ^5.2.1+1
  path: ^1.8.3
  uuid: ^3.0.7
  intl: ^0.18.0
  
  # File Handling
  file_picker: ^5.3.2
  permission_handler: ^10.4.3
  
  # Window Management
  window_manager: ^0.3.4
  
  # Logging
  logger: ^1.4.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  
  # Testing
  mockito: ^5.4.2
  build_runner: ^2.4.6
  
  # Code Generation
  riverpod_generator: ^2.2.3
  hive_generator: ^2.0.0
  json_serializable: ^6.7.1
  
  # Linting
  flutter_lints: ^3.0.1
  custom_lint: ^0.5.0
  test: ^1.25.7

flutter:
  uses-material-design: true
  
  assets:
    - assets/
    - assets/models/
    - assets/templates/
    - assets/images/
    - assets/fonts/
  
  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Italic.ttf
          style: italic